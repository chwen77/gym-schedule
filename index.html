<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d8d6d0">
<meta name="apple-mobile-web-app-title" content="健身課表">
<title>健身工廠課表</title>
<style>
:root{
  /* low-glare light theme: warm gray surfaces, no pure white */
  --bg:#d8d6d0;--panel:#e8e6e1;--ink:#2a2926;--muted:#5d5b55;--line:#c6c3bb;--soft:#dfddd7;
  --accent:#c2410c;--accent-soft:#efd9cb;--chip:#d3d0c9;--chip-on:#34332f;--chip-on-ink:#eeece7;
  --sub:#8f5b00;--today:#eedfae;--today-ink:#7a5000;
  /* weekend: Saturday blue, Sunday red (Taiwan calendar convention) */
  --sat:#f2c919;--sat-line:#d9b000;--sat-ink:#2a2926;
  --sun:#f2c919;--sun-line:#d9b000;--sun-ink:#2a2926;
  --wk-soft:#e8ecf2;--bar:#2e2e2c;--bar-ink:#f2f0ea;
  /* course categories */
  --c-spin:#1f58d6;--c-yoga:#12814f;--c-dance:#c02a5c;--c-aero:#6e6488;
  --shadow:0 1px 2px rgba(20,20,10,.08);
  /* personal favorites: nearby stores (teal), favorite teachers (violet) */
  --zh:#a84a00;--zh-ink:#ffffff;--sh:#9cc3f5;--sh-ink:#10284f;--fav:#7a4f00;--fav-soft:#d4ebc9;--fav-line:#8fc27a;--fav-pill:#f5d25a;--fav-ink:#3a2600;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211;--panel:#1c1c1a;--ink:#ecebe6;--muted:#9c9b94;--line:#2f2f2b;--soft:#232320;
  --accent:#ff8a4c;--accent-soft:#3a2418;--chip:#282825;--chip-on:#ecebe6;--chip-on-ink:#141413;
  --sub:#e0b44c;--today:#3a3013;--today-ink:#f3c95b;
  --sat:#c9a200;--sat-line:#a88700;--sat-ink:#1a1a18;
  --sun:#c9a200;--sun-line:#a88700;--sun-ink:#1a1a18;
  --wk-soft:#1f232a;--bar:#0c0c0b;--bar-ink:#ecebe6;
  --c-spin:#6f9bff;--c-yoga:#43c48c;--c-dance:#f06595;--c-aero:#a99cc8;
  --shadow:none;
  --zh:#e8841f;--zh-ink:#1f1204;--sh:#a9ccf7;--sh-ink:#0c1f3d;--fav:#f3c95b;--fav-soft:#1f3322;--fav-line:#3f6b45;--fav-pill:#6b5516;--fav-ink:#ffe9a8;
}}
:root[data-theme="dark"]{
  --bg:#121211;--panel:#1c1c1a;--ink:#ecebe6;--muted:#9c9b94;--line:#2f2f2b;--soft:#232320;
  --accent:#ff8a4c;--accent-soft:#3a2418;--chip:#282825;--chip-on:#ecebe6;--chip-on-ink:#141413;
  --sub:#e0b44c;--today:#3a3013;--today-ink:#f3c95b;
  --sat:#c9a200;--sat-line:#a88700;--sat-ink:#1a1a18;
  --sun:#c9a200;--sun-line:#a88700;--sun-ink:#1a1a18;
  --wk-soft:#1f232a;--bar:#0c0c0b;--bar-ink:#ecebe6;
  --c-spin:#6f9bff;--c-yoga:#43c48c;--c-dance:#f06595;--c-aero:#a99cc8;
  --shadow:none;
  --zh:#e8841f;--zh-ink:#1f1204;--sh:#a9ccf7;--sh-ink:#0c1f3d;--fav:#f3c95b;--fav-soft:#1f3322;--fav-line:#3f6b45;--fav-pill:#6b5516;--fav-ink:#ffe9a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{max-width:1200px;margin:0 auto;padding:22px 16px 4px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{margin:0;font-size:24px;letter-spacing:.03em}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.theme{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:0 16px 56px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}

/* dropdowns */
.selects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.selects label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.selects select{font:inherit;font-size:15px;font-weight:400;letter-spacing:0;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;cursor:pointer}
.selects select.set{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tgl{display:flex;align-items:center;gap:6px;width:100%;min-height:42px;font:inherit;font-size:15px;font-weight:400;letter-spacing:0;text-align:left;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.tgl .svgi{flex:none}
.tgl .sw{margin-left:auto;flex:none;width:34px;height:20px;border-radius:999px;background:var(--chip);border:1px solid var(--line);position:relative}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s}
.tgl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tgl[aria-pressed="true"] .sw{background:var(--accent);border-color:var(--accent)}
.tgl[aria-pressed="true"] .sw::after{left:16px;background:#fff}
@media (prefers-reduced-motion:reduce){.tgl .sw::after{transition:none}}
@media (max-width:1000px){.selects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.selects{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* advanced chips */
.adv summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.adv[open] summary{margin-bottom:8px}
.row{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.row>label{flex:0 0 52px;color:var(--muted);font-size:13px;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.chip small{opacity:.7;margin-left:3px;font-size:12px}
.chip.sat{background:var(--sat);color:var(--sat-ink);border-color:var(--sat-line)}
.chip.sun{background:var(--sun);color:var(--sun-ink);border-color:var(--sun-line)}
.chip.sat.on,.chip.sun.on{background:currentColor}
.chip.sat.on{background:var(--sat-ink);color:#fff}.chip.sun.on{background:var(--sun-ink);color:#fff}
.cloud{max-height:132px;overflow:auto;padding:2px}
.cloud.open{max-height:none}
input[type=search]{width:100%;font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);margin-bottom:6px}
.more{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:2px 0}

/* category summary cards */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 4px}
.catcard{--k:var(--muted);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;box-shadow:var(--shadow)}
.catcard .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent)}
.catcard b{display:block;font-size:14px}
.catcard span{color:var(--muted);font-size:12.5px}
.catcard.on{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
.catcard.dim{opacity:.45}
.ftoggle{display:none}
@media (max-width:640px){
  /* mobile: filters collapse behind a toggle; category cards become one scrollable row */
  header{padding-top:14px}
  h1{font-size:20px}
  .meta{font-size:12px}
  .tgl{font-size:14px;padding:9px 8px;white-space:nowrap}
  .tgl>.svgi{display:none}
  .ftoggle{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0 0;padding:11px 14px;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
  .ftoggle .chev{margin-left:auto;transition:transform .2s}
  .ftoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .fcount{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
  .fcount:empty{display:none}
  .filters{display:none}
  .filters.open{display:block}
  .cats{display:flex;overflow-x:auto;gap:8px;margin:10px -16px 2px;padding:2px 16px 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .catcard{flex:none;padding:6px 12px 6px 6px;border-radius:999px;gap:8px;min-height:40px}
  .catcard .ic{width:28px;height:28px;border-radius:999px;font-size:15px}
  .catcard b{display:inline;font-size:13.5px}
  .catcard span{margin-left:4px}
  .catcard>div:last-child{white-space:nowrap}
  .toolbar{margin-top:8px}
  .legend{font-size:12px;gap:4px 12px}
}
@media (prefers-reduced-motion:reduce){.ftoggle .chev{transition:none}}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.count{font-weight:700;font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:4px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.clear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* shared bits */
.time{font-variant-numeric:tabular-nums;font-weight:700}
.name{font-weight:700}
.link{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.link.name{font-weight:700}
.who .link{display:inline-block;min-height:26px;line-height:22px;padding:2px 0;vertical-align:middle}
.who .link.fav{padding:2px 6px}
.link:hover{color:var(--accent);text-decoration:underline}
.who{color:var(--muted);font-size:13.5px}
.svgi{width:1em;height:1em;vertical-align:-.14em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svgi.solid{fill:currentColor;stroke:none}
.who>.svgi{opacity:.7;margin-right:4px}
.tri-c{color:#d6336c}
.legend .svgi{margin-right:3px}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.badge.cat{color:color-mix(in srgb,var(--k) 70%,var(--ink));background:color-mix(in srgb,var(--k) 13%,transparent)}
.badge.subst{color:var(--sub);border:1px solid currentColor}
.badge.lv{border:1px solid currentColor}
.place{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.place b{background:var(--chip);color:var(--ink);border-radius:6px;padding:1px 8px;font-weight:600}
.place b.home{background:var(--hc);color:var(--hc-ink)}
.place b.home .svgi{margin-right:4px}
.link.fav{color:var(--fav-ink);font-weight:700;background:var(--fav-pill);border-radius:6px;padding:0 6px}
.link.fav .svgi{margin-right:3px;vertical-align:-.1em}
.item.favt,.card.favt{background:var(--fav-soft);border-color:var(--fav-line);border-left-color:var(--k)}
.item.home:not(.favt),.card.home:not(.favt){box-shadow:inset 0 0 0 2px var(--hc),var(--shadow)}
.home{--hc:var(--zh);--hc-ink:var(--zh-ink)}
.home.sh{--hc:var(--sh);--hc-ink:var(--sh-ink)}
.empty{text-align:center;color:var(--muted);padding:48px 0}

/* list view */
.day{margin-top:22px;border-radius:16px}
.dayhead{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;padding:10px 14px;margin-bottom:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.dayhead .d{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.dayhead .w{font-size:15px;font-weight:700}
.dayhead .n{margin-left:auto;color:var(--muted);font-size:13px}
.dayhead .tt{font-size:12px;font-weight:700;color:var(--today-ink);background:var(--today);border-radius:999px;padding:1px 9px}
.day.sat .dayhead{background:var(--sat);border-color:var(--sat-line)}
.day.sat .dayhead .d,.day.sat .dayhead .w,.day.sat .dayhead .n{color:var(--sat-ink)}
.day.sun .dayhead{background:var(--sun);border-color:var(--sun-line)}
.day.sun .dayhead .d,.day.sun .dayhead .w,.day.sun .dayhead .n{color:var(--sun-ink)}
.slotlbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:12px 4px 4px}
.item{--k:var(--muted);display:grid;grid-template-columns:78px 1fr auto;gap:2px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:12px;padding:10px 14px;margin:6px 0;box-shadow:var(--shadow)}
.item .time{font-size:17px;line-height:1.15}
.item .time small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.item .name{font-size:16px}
@media (max-width:640px){
  .row{flex-direction:column;gap:4px}
  .row>label{flex:none;padding:0}
  .item{grid-template-columns:62px 1fr}
  .item .place{grid-column:2}
}

/* grid view: header modeled on the official site (dark legend bar + date row, weekend in yellow) */
.wk{font-size:15px;font-weight:700;margin:22px 0 6px}
.gridwrap{overflow-x:auto;padding-bottom:6px}
.gtable{min-width:1100px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.gbar{background:var(--bar);color:var(--bar-ink);display:flex;justify-content:center;gap:36px;padding:12px;font-size:14px;font-weight:700}
.gbar i{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px}
.gbar .svgi{margin-right:6px}
.gbar .tri-c{color:#f06595}
.pill .svgi{margin-left:4px;vertical-align:-.15em}
.chip .svgi{margin-right:4px}
.ghead,.grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr))}
.ghead{background:var(--panel);border-bottom:1px solid var(--ink)}
.gh{text-align:center;padding:18px 4px 16px}
.gh .d{display:block;font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.gh .w{display:block;font-size:14px;color:var(--muted);margin-top:8px}
.gh .n{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.gh.sat,.gh.sun{background:var(--sat)}
.gh.sat .w,.gh.sun .w,.gh.sat .n,.gh.sun .n{color:var(--sat-ink)}
.gh.today .d{text-decoration:underline 3px var(--accent);text-underline-offset:6px}
.grid{gap:0;background:var(--line)}
.gcol{display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--bg);border-right:1px solid var(--line)}
.gcol:last-child{border-right:0}
.gcol.sat,.gcol.sun{background:var(--wk-soft)}
.card{--k:var(--muted);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--k);border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.4}
.card .time{font-size:13px}
.card .name{font-size:14px;display:block}
.card .badge{margin-left:0;margin-right:4px}
.card .place{font-size:12px}
.legend.hide{display:none}
</style>
</head>
<body>
<header>
  <div>
    <h1>健身工廠 <span>團課課表</span></h1>
    <div class="meta" id="meta"></div>
  </div>
  <button class="theme" id="theme">深 / 淺色</button>
</header>
<main>
  <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
    <svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
    <span>篩選條件</span><span class="fcount" id="fcount"></span>
    <svg class="svgi chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="filters" id="filters">
  <section class="panel quick">
    <div class="selects">
      <label>日期<select id="s-date"></select></label>
      <label>老師<select id="s-teacher"></select></label>
      <label>大類<select id="s-cat"></select></label>
      <label>課程<select id="s-course"></select></label>
      <label>地點<select id="s-store"></select></label>
      <label>時段<select id="s-slot"></select></label>
      <label>常去分店<button type="button" class="tgl" id="t-home" data-flag="homeOnly" aria-pressed="false"></button></label>
      <label>喜愛老師<button type="button" class="tgl" id="t-fav" data-flag="favOnly" aria-pressed="false"></button></label>
    </div>
  </section>
  <details class="panel adv"><summary>更多篩選（多選、星期、搜尋）</summary>
    <div class="row"><label>分店</label><div class="chips" id="f-store"></div></div>
    <div class="row"><label>日期</label><div class="chips" id="f-week"></div></div>
    <div class="row"><label>大類</label><div class="chips" id="f-cat"></div></div>
    <div class="row"><label>星期</label><div class="chips" id="f-wd"></div></div>
    <div class="row"><label>時段</label><div class="chips" id="f-slot"></div></div>
    <div class="row"><label>老師</label><div style="flex:1;min-width:0">
      <input type="search" id="q-teacher" placeholder="搜尋老師…">
      <div class="chips cloud" id="f-teacher"></div>
      <button class="more" data-for="f-teacher">展開全部</button></div></div>
    <div class="row"><label>課程</label><div style="flex:1;min-width:0">
      <input type="search" id="q-course" placeholder="搜尋課程，例如：瑜珈、飛輪、槓鈴…">
      <div class="chips cloud" id="f-course"></div>
      <button class="more" data-for="f-course">展開全部</button></div></div>
    <div class="row"><label>其他</label><div class="chips" id="f-misc"></div></div>
  </details>
  </div>

  <div class="cats" id="cats"></div>

  <div class="toolbar">
    <div class="picked" id="picked"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
      <span class="count" id="count"></span>
      <div class="seg" id="view"><button data-v="list" class="on">列表</button><button data-v="grid">週表</button></div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="out"></div>

function saveHash(){
  const o = {};
  for (const k of KEYS) if (S[k].size) o[k] = [...S[k]];
  for (const k of ["hideNotice","subOnly","fromToday","homeOnly","favOnly"]) o[k] = S[k];
  o.view = S.view;
  history.replaceState(null, "", "#"+encodeURIComponent(JSON.stringify(o)));
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate = iso => { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; };
const wdOfISO = iso => (new Date(iso+"T00:00:00").getDay()+6)%7;

// Filter with option to ignore one dimension (for facet counts)
function match(c, skip){
  if (S.hideNotice && isNotice(c)) return false;
  if (S.subOnly && !isSub(c)) return false;
  if (S.homeOnly && !isHome(c)) return false;
  if (S.favOnly && !isFavT(c)) return false;
  if (S.fromToday && c.date < todayISO) return false;
  if (skip!=="store" && S.store.size && !S.store.has(c.store)) return false;
  if (skip!=="date" && S.date.size && !S.date.has(c.date)) return false;
  if (skip!=="week" && S.week.size && !S.week.has(weekOf(c))) return false;
  if (skip!=="wd" && S.wd.size && !S.wd.has(String(c.wd))) return false;
  if (skip!=="slot" && S.slot.size && !S.slot.has(slotOf(c))) return false;
  if (skip!=="teacher" && S.teacher.size && !teachersOf(c).some(t => S.teacher.has(t))) return false;
  if (skip!=="cat" && S.cat.size && !S.cat.has(catOf(c))) return false;
  if (skip!=="course" && S.course.size && !S.course.has(cname(c))) return false;
  return true;
}

function countBy(skip, keyFn){
  const m = new Map();
  for (const c of DATA.classes) if (match(c, skip)) for (const k of [].concat(keyFn(c))) m.set(k, (m.get(k)||0)+1);
  return m;
}

function chips(el, items, key, clsFn){
  el.innerHTML = items.map(([v,label,n]) =>
    `<button class="chip ${clsFn ? clsFn(v) : ""}${S[key].has(v)?" on":""}" data-k="${key}" data-v="${esc(v)}">${esc(label)}${n!=null?`<small>${n}</small>`:""}</button>`).join("");
}

function cloud(el, key, counts, q){
  const ql = q.trim().toLowerCase();
  const items = [...counts.entries()]
    .filter(([k]) => !ql || k.toLowerCase().includes(ql))
    .sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], "zh-Hant"));
  // Keep selected ones visible even if zero
  for (const v of S[key]) if (!counts.has(v)) items.unshift([v,0]);
  chips(el, items.map(([k,n]) => [k,k,n]), key);
}

function render(){
  renderSelects();
  const byStore = countBy("store", c => c.store);
  chips($("f-store"), DATA.stores.map(s => [s,s,byStore.get(s)||0]), "store");
  const byWeek = countBy("week", weekOf);
  chips($("f-week"), weeks.map((w,i) => {
    const e = new Date(w+"T00:00:00"); e.setDate(e.getDate()+6);
    return [w, `${i===0?"本週":i===1?"下週":"第"+(i+1)+"週"} ${fmtDate(w)}–${fmtDate(e.toLocaleDateString("sv"))}`, byWeek.get(w)||0];
  }), "week");
  const byCat = countBy("cat", catOf);
  chips($("f-cat"), CAT_NAMES.map(k => [k,k,byCat.get(k)||0]), "cat");
  const byWd = countBy("wd", c => String(c.wd));
  chips($("f-wd"), [...WD].map((w,i) => [String(i),"週"+w,byWd.get(String(i))||0]), "wd", v => wdClass(+v));
  const bySlot = countBy("slot", slotOf);
  chips($("f-slot"), Object.entries(SLOTS).map(([k,[a,b]]) => [k,`${a} ${b}`,bySlot.get(k)||0]), "slot");
  cloud($("f-teacher"), "teacher", countBy("teacher", teachersOf), $("q-teacher").value);
  cloud($("f-course"), "course", countBy("course", cname), $("q-course").value);
  $("f-misc").innerHTML = [
    ["fromToday","只看今天以後"],["hideNotice","隱藏公告"],["subOnly",`${ic("tri","tri-c")}只看代課`]
  ].map(([k,l]) => `<button class="chip${S[k]?" on":""}" data-flag="${k}">${l}</button>`).join("");

  // Category summary cards (click to toggle)
  $("cats").innerHTML = CAT_NAMES.map(k => {
    const on = S.cat.has(k), dim = S.cat.size && !on;
    return `<button class="catcard${on?" on":""}${dim?" dim":""}" style="--k:${catVar(k)}" data-k="cat" data-v="${k}">
      <div class="ic">${ic(CAT_STYLE[k][1])}</div><div><b>${k}</b><span>${byCat.get(k)||0} 堂</span></div></button>`;
  }).join("");

  const pill = (k, v, label) => `<button class="pill" data-k="${k}" data-v="${esc(v)}">${esc(label)}${ic("x")}</button>`;
  const picked = [
    ...[...S.date].map(d => pill("date", d, `日期：${fmtDate(d)}`)),
    ...[...S.teacher].map(t => pill("teacher", t, `老師：${t}`)),
    ...[...S.cat].map(t => pill("cat", t, `大類：${t}`)),
    ...[...S.course].map(t => pill("course", t, `課程：${t}`)),
    ...[...S.slot].map(t => pill("slot", t, `時段：${SLOTS[t][0]}`)),
    ...[...S.store].map(t => pill("store", t, `地點：${t}廠`)),
    ...[...S.wd].map(t => pill("wd", t, `週${WD[t]}`)),
  ];
  $("t-home").innerHTML = `${ic("home")}<span>只看中和雙和</span><span class="sw"></span>`;
  $("t-fav").innerHTML = `${ic("star")}<span>只看喜愛老師</span><span class="sw"></span>`;
  $("t-home").setAttribute("aria-pressed", S.homeOnly);
  $("t-fav").setAttribute("aria-pressed", S.favOnly);
  if (S.homeOnly) picked.push(`<button class="pill" data-flag="homeOnly">常去：中和／雙和${ic("x")}</button>`);
  if (S.favOnly) picked.push(`<button class="pill" data-flag="favOnly">喜愛老師${ic("x")}</button>`);
  const any = KEYS.some(k => S[k].size) || S.homeOnly || S.favOnly;
  const nSel = KEYS.reduce((n,k) => n + S[k].size, 0) + S.homeOnly + S.favOnly;
  $("fcount").textContent = nSel ? `已選 ${nSel}` : "";
  $("picked").innerHTML = picked.join("") + (any ? `<button class="clear" id="clear">清除全部篩選</button>` : "");

  const list = DATA.classes.filter(c => match(c));
  $("count").textContent = `共 ${list.length} 堂課`;
  $("legend").classList.toggle("hide", S.view==="grid");
  document.querySelectorAll("#view button").forEach(b => b.classList.toggle("on", b.dataset.v===S.view));
  $("out").innerHTML = !list.length ? `<div class="empty">沒有符合的課程，試著放寬篩選條件</div>`
    : S.view==="list" ? renderList(list) : renderGrid(list);
  saveHash();
}

function teacherLinks(c){
  return ic("user") + (teachersOf(c).map(t => `<button class="link${FAV_TEACHERS.has(t)?" fav":""}" data-k="teacher" data-v="${esc(t)}" title="只看這位老師">${FAV_TEACHERS.has(t)?ic("star"):""}${esc(t)}</button>`).join(" / ") || "—");
}
function badges(c){
  const k = catOf(c);
  return `<span class="badge cat" style="--k:${catVar(k)}">${k}</span>`
    + (isSub(c) ? `<span class="badge subst">代課</span>` : "")
    + (c.color && DATA.legend[c.color] ? `<span class="badge lv" style="color:color-mix(in srgb,${c.color} 65%,var(--ink))">${esc(DATA.legend[c.color])}</span>` : "");
}
function courseLink(c){
  return `<button class="link name" data-k="course" data-v="${esc(cname(c))}" title="只看這堂課">${esc(cname(c))}</button>`;
}
function place(c){ return `<span class="place"><b${isHome(c)?` class="home${c.store==="雙和"?" sh":""}"`:""}>${isHome(c)?ic("home"):""}${esc(c.store)}</b>${esc(c.room)}</span>`; }

function renderList(list){
  const groups = new Map();
  for (const c of list) (groups.get(c.date) || groups.set(c.date, []).get(c.date)).push(c);
  let h = "";
  for (const [d, cs] of groups){
    const wd = cs[0].wd;
    h += `<section class="day ${wdClass(wd)}"><div class="dayhead">
      <span class="d">${fmtDate(d)}</span><span class="w">星期${WD[wd]}</span>
      ${d===todayISO?`<span class="tt">今天</span>`:""}<span class="n">${cs.length} 堂</span></div>`;
    let lastSlot = "";
    for (const c of cs){
      const s = slotOf(c);
      if (s !== lastSlot){ h += `<div class="slotlbl">${SLOTS[s][0]}</div>`; lastSlot = s; }
      h += `<div class="item${favCls(c)}" style="--k:${catVar(catOf(c))}">
        <div class="time">${esc(c.start)}<small>– ${esc(c.end)}</small></div>
        <div>${courseLink(c)}${badges(c)}<div class="who">${teacherLinks(c)}</div></div>
        ${place(c)}</div>`;
    }
    h += `</section>`;
  }
  return h;
}

function renderGrid(list){
  const bar = `<div class="gbar">${Object.entries(DATA.legend).map(([c,l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}<span>${ic("tri","tri-c")}代課課程</span><span><i style="background:var(--zh)"></i>${ic("home")}中和</span><span><i style="background:var(--sh)"></i>${ic("home")}雙和</span><span><i style="background:var(--fav-soft);outline:1px solid var(--fav-line)"></i>${ic("star")}喜愛老師</span></div>`;
  let h = "";
  for (const [wi, w] of weeks.entries()){
    const cs = list.filter(c => weekOf(c)===w);
    if (!cs.length) continue;
    const cols = [...WD].map(() => []);
    for (const c of cs) cols[c.wd].push(c);
    const isos = cols.map((_,i) => { const d = new Date(w+"T00:00:00"); d.setDate(d.getDate()+i); return d.toLocaleDateString("sv"); });
    h += `<div class="wk">${wi===0?"本週":wi===1?"下週":""}　${fmtDate(w)} – ${fmtDate(isos[6])}</div><div class="gridwrap"><div class="gtable">${bar}`;
    h += `<div class="ghead">${isos.map((iso,i) => `<div class="gh ${wdClass(i)}${iso===todayISO?" today":""}">
      <span class="d">${iso.slice(8)}</span><span class="w">星期${WD[i]}${iso===todayISO?"（今天）":""}</span><span class="n">${cols[i].length} 堂</span></div>`).join("")}</div>`;
    h += `<div class="grid">${cols.map((col,i) => `<div class="gcol ${wdClass(i)}">
        ${col.map(c => `<div class="card${favCls(c)}" style="--k:${catVar(catOf(c))}">
          <div class="time">${esc(c.start)}–${esc(c.end)}</div>${courseLink(c)}
          <div>${badges(c).replace(/^<span class="badge cat"[^>]*>[^<]*<\/span>/, "")}</div>
          <div class="who">${teacherLinks(c)}</div>${place(c)}</div>`).join("")}
      </div>`).join("")}</div>`;
    h += `</div></div>`;
  }
  return h;
}

// Dropdowns: single-value shortcuts onto the same filter sets
const SEL = {date:"s-date", teacher:"s-teacher", cat:"s-cat", course:"s-course", store:"s-store", slot:"s-slot"};
function renderSelects(){
  const opts = {
    date: [...countBy("date", c => c.date)].sort((a,b) => a[0].localeCompare(b[0]))
      .map(([d,n]) => { const w = wdOfISO(d); return [d, `${fmtDate(d)}（${WD[w]}）${w>=5?" 週末":""}${d===todayISO?" 今天":""}`, n, wdClass(w)]; }),
    teacher: [...countBy("teacher", teachersOf)].sort((a,b) => (FAV_TEACHERS.has(b[0]) - FAV_TEACHERS.has(a[0])) || a[0].localeCompare(b[0], "zh-Hant"))
      .map(([k,n]) => [k, FAV_TEACHERS.has(k) ? `${k}（喜愛）` : k, n, FAV_TEACHERS.has(k) ? "fav" : ""]),
    course: [...countBy("course", cname)].sort((a,b) => a[0].localeCompare(b[0], "zh-Hant")).map(([k,n]) => [k,k,n]),
    cat: (m => CAT_NAMES.map(k => [k, k, m.get(k)||0]))(countBy("cat", catOf)),
    slot: (m => Object.entries(SLOTS).map(([k,[a,b]]) => [k, `${a}（${b}）`, m.get(k)||0]))(countBy("slot", slotOf)),
    store: (m => [...DATA.stores].sort((a,b) => HOME_STORES.has(b) - HOME_STORES.has(a))
      .map(s => [s, HOME_STORES.has(s) ? `${s}廠（常去）` : s+"廠", m.get(s)||0, HOME_STORES.has(s) ? (s==="雙和" ? "homesh" : "home") : ""]))(countBy("store", c => c.store)),
  };
  const allLabel = {date:"全部日期", teacher:"全部老師", cat:"全部大類", course:"全部課程", store:"全部地點", slot:"全部時段"};
  const optStyle = {fav:"color:#7a4f00;font-weight:700", home:"color:#c75a00;font-weight:700", homesh:"color:#1e3a8a;font-weight:700", sat:"background:#f2c919;color:#2a2926", sun:"background:#f2c919;color:#2a2926"};
  for (const [k,id] of Object.entries(SEL)){
    const el = $(id), set = S[k];
    let h = `<option value="">${allLabel[k]}</option>`;
    if (set.size > 1) h += `<option value="__multi" selected>已選 ${set.size} 項</option>`;
    const shown = new Set(opts[k].map(o => o[0]));
    for (const v of set) if (!shown.has(v)) opts[k].unshift([v, v, 0]);
    h += opts[k].map(([v,l,n,cls]) => `<option value="${esc(v)}"${cls?` style="${optStyle[cls]}"`:""}${set.size===1&&set.has(v)?" selected":""}>${esc(l)}（${n}）</option>`).join("");
    el.innerHTML = h;
    el.classList.toggle("set", set.size > 0);
  }
}
for (const [k,id] of Object.entries(SEL)) $(id).addEventListener("change", e => {
  const v = e.target.value; if (v === "__multi") return;
  S[k].clear(); if (v) S[k].add(v);
  if (k === "date" && v) S.week.clear();
  render();
});

// Mobile filter toggle
$("ftoggle").addEventListener("click", () => {
  const open = $("filters").classList.toggle("open");
  $("ftoggle").setAttribute("aria-expanded", open);
});

// Events
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k){ const set = S[b.dataset.k], v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v); render(); }
  else if (b.dataset.flag){ S[b.dataset.flag] = !S[b.dataset.flag]; render(); }
  else if (b.dataset.v && b.closest("#view")){ S.view = b.dataset.v; render(); }
  else if (b.id==="clear"){ for (const k of KEYS) S[k].clear(); S.homeOnly = S.favOnly = false; $("q-teacher").value=$("q-course").value=""; render(); }
  else if (b.classList.contains("more")){ const el = $(b.dataset.for); el.classList.toggle("open"); b.textContent = el.classList.contains("open")?"收合":"展開全部"; }
  else if (b.id==="theme"){ const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue("--bg").trim()==="#121211";
    r.dataset.theme = dark ? "light" : "dark"; try{localStorage.setItem("ff-theme", r.dataset.theme)}catch(e){} }
});
$("q-teacher").addEventListener("input", render);
$("q-course").addEventListener("input", render);
try{ const t = localStorage.getItem("ff-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}

$("meta").textContent = `${fmtDate(DATA.range[0])} ～ ${fmtDate(DATA.range[1])}・${DATA.stores.join("、")}・資料抓取於 ${DATA.fetched}`;
$("legend").innerHTML = `<span><i style="background:var(--zh)"></i>${ic("home")}中和</span><span><i style="background:var(--sh)"></i>${ic("home")}雙和</span><span><i style="background:var(--fav-soft);outline:1px solid var(--fav-line)"></i>${ic("star")}喜愛老師</span><span><i style="background:var(--sat)"></i>週末</span>`
  + Object.entries(DATA.legend).map(([c,l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")
  + `<span>${ic("tri","tri-c")} 代課</span><span>點老師或課程名稱可直接篩選</span>`;
render();
</script>
</body>
</html>
